services:
  splitbill_api:
    container_name: splitbill_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: "3000"
      STORAGE_LOCAL_PATH: /app/storage/public
      LOG_DIR: /app/storage/logs
    volumes:
      - ./storage/public:/app/storage/public
      - ./storage/logs:/app/storage/logs
      # Uncomment when BUCKET_STORAGE=FIREBASE:
      # - ./storage/firebase-adminsdk.json:/app/storage/firebase-adminsdk.json:ro
    expose:
      - "3000"
    networks:
      - app_network

  splitbill_nginx:
    container_name: splitbill_nginx
    image: nginx:alpine
    ports:
      - "8031:8031"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - splitbill_api
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
