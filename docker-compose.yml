# Splitbill API — uses shared-infra Postgres (network: shared_infra)
# Start shared-infra first: cd ../shared-infra && docker compose up -d

services:
  splitbill_api:
    container_name: splitbill_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: "3000"
      STORAGE_LOCAL_PATH: /app/storage/public
      LOG_DIR: /app/storage/logs
      # DATABASE_URL must point to shared_postgres (set in .env)
      HTTP_BODY_LIMIT_BYTES: "5242880"
      RATE_LIMIT_RPM: "5"
      AUTH_RATE_LIMIT_RPM: "10"
      GLOBAL_RATE_LIMIT_RPM: "60"
      EXTRACT_MAX_CONCURRENT: "5"
      GEMINI_TIMEOUT_SEC: "15"
    volumes:
      - ./storage/public:/app/storage/public
      - ./storage/logs:/app/storage/logs
    ports:
      - "8031:3000"
    networks:
      - shared_infra
      - default

networks:
  shared_infra:
    external: true
    name: shared_infra
