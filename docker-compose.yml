services:
  splitbill_api:
    container_name: splitbill_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: "3000"
      STORAGE_LOCAL_PATH: /app/storage/public
      LOG_DIR: /app/storage/logs
      # Security Phase 1 defaults (override in .env for production)
      HTTP_BODY_LIMIT_BYTES: "5242880"
      RATE_LIMIT_RPM: "5"
      EXTRACT_MAX_CONCURRENT: "5"
      GEMINI_TIMEOUT_SEC: "25"
    volumes:
      - ./storage/public:/app/storage/public
      - ./storage/logs:/app/storage/logs
      # Uncomment when BUCKET_STORAGE=FIREBASE:
      # - ./storage/firebase-adminsdk.json:/app/storage/firebase-adminsdk.json:ro
    ports:
      - "8031:3000"
