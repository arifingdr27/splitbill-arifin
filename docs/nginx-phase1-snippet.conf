# Nginx snippet — Security Phase 1 (deploy behind reverse proxy)
# Apply on the host that proxies to splitbill-api.
# Defaults align with docs/security-sds.md §6.3 / Phase 1.

limit_req_zone $binary_remote_addr zone=splitbill_api:10m rate=10r/m;

server {
    # TLS termination omitted — keep your existing cert config.

    client_max_body_size 2m;

    # Block Swagger at the edge in production (app also disables it when APP_ENV=production).
    location ^~ /swagger {
        return 404;
    }

    location /api/v2 {
        limit_req zone=splitbill_api burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8031; # adjust to your upstream
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
